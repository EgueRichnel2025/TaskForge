name: TaskForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Code quality and tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://taskforge:taskforge_ci_password@localhost:5432/taskforge

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskforge
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskforge -d taskforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check app tests

      - name: Run tests
        run: python -m pytest -v

  build-and-scan:
    name: Build and scan container image
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag taskforge-api:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskforge-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL